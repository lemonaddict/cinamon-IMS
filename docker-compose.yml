# Optional. Local development does NOT need Docker (see README.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ims
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ims
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims"]
      interval: 5s
      retries: 10
  migrate:
    image: migrate/migrate
    command: ["-path=/migrations", "-database", "postgres://ims:${DB_PASSWORD}@db:5432/ims?sslmode=disable", "up"]
    volumes: ["./backend/migrations:/migrations:ro"]
    depends_on: { db: { condition: service_healthy } }
  api:
    build: ./backend
    environment:
      APP_ENV: production
      ADDR: ":8080"
      DATABASE_URL: postgres://ims:${DB_PASSWORD}@db:5432/ims?sslmode=disable
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes:
  pgdata: {}
